<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>标签 - Almagest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-tertiary: #1a1a24;
      --text-primary: #e8e8ed;
      --text-secondary: #8b8b99;
      --text-tertiary: #5c5c6d;
      --accent-primary: #7c9cf0;
      --accent-secondary: #c9a0ff;
      --accent-tertiary: #64d2ff;
      --accent-glow: rgba(124, 156, 240, 0.3);
      --border-primary: rgba(255, 255, 255, 0.08);
      --font-sans: "Inter", "Noto Sans SC", -apple-system, sans-serif;
      --content-width: 800px;
      --content-padding: 24px;
      --transition-fast: 150ms ease-out;
      --transition-normal: 250ms ease-out;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.8;
      color: var(--text-primary);
      background-color: var(--bg-primary);
      min-height: 100vh;
    }

    a {
      color: var(--text-primary);
      text-decoration: none;
      transition: color var(--transition-fast);
    }

    a:hover {
      color: var(--accent-primary);
    }

    /* Header */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: rgba(10, 10, 15, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-primary);
    }

    .header-inner {
      max-width: var(--content-width);
      margin: 0 auto;
      padding: 0 var(--content-padding);
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 32px;
    }

    .nav-link {
      font-size: 14px;
      color: var(--text-secondary);
      transition: color var(--transition-fast);
    }

    .nav-link:hover,
    .nav-link.active {
      color: var(--accent-primary);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .moon-phase {
      font-size: 20px;
      cursor: pointer;
      opacity: 0.7;
    }

    .theme-toggle {
      width: 32px;
      height: 32px;
      border: none;
      background: var(--bg-tertiary);
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      transition: all var(--transition-fast);
    }

    /* Page Header */
    .page-header {
      padding: 120px var(--content-padding) 60px;
      text-align: center;
    }

    .page-header-inner {
      max-width: var(--content-width);
      margin: 0 auto;
    }

    .page-title {
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 16px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .page-subtitle {
      font-size: 16px;
      color: var(--text-secondary);
    }

    /* Tags Cloud */
    .tags-content {
      max-width: var(--content-width);
      margin: 0 auto;
      padding: 0 var(--content-padding) 80px;
    }

    .tags-cloud {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      padding: 24px 0;
    }

    .tag-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-primary);
      border-radius: 20px;
      font-size: 14px;
      color: var(--text-secondary);
      transition: all var(--transition-normal);
    }

    .tag-item:hover {
      border-color: var(--accent-primary);
      color: var(--accent-primary);
      transform: translateY(-2px);
      box-shadow: 0 4px 16px var(--accent-glow);
    }

    .tag-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      background: var(--bg-tertiary);
      border-radius: 10px;
      font-size: 11px;
      color: var(--text-tertiary);
    }

    /* Tag size variations */
    .tag-item.size-xl {
      font-size: 24px;
      padding: 12px 24px;
    }

    .tag-item.size-xl .tag-count {
      font-size: 14px;
      min-width: 28px;
      height: 28px;
    }

    .tag-item.size-lg {
      font-size: 18px;
      padding: 10px 20px;
    }

    .tag-item.size-lg .tag-count {
      font-size: 12px;
      min-width: 24px;
      height: 24px;
    }

    .tag-item.size-md {
      font-size: 15px;
      padding: 8px 16px;
    }

    .tag-item.size-sm {
      font-size: 13px;
      padding: 6px 12px;
    }

    /* Color variations */
    .tag-item.color-purple:hover {
      border-color: var(--accent-secondary);
      color: var(--accent-secondary);
    }

    .tag-item.color-cyan:hover {
      border-color: var(--accent-tertiary);
      color: var(--accent-tertiary);
    }

    /* Footer */
    .footer {
      padding: 40px var(--content-padding);
      border-top: 1px solid var(--border-primary);
      text-align: center;
    }

    .footer-inner {
      max-width: var(--content-width);
      margin: 0 auto;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-bottom: 16px;
    }

    .footer-link {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .footer-copyright {
      font-size: 13px;
      color: var(--text-tertiary);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .nav {
        display: none;
      }

      .page-header {
        padding: 100px 20px 40px;
      }

      .page-title {
        font-size: 28px;
      }

      .tags-content {
        padding: 0 20px 60px;
      }

      .tags-cloud {
        gap: 10px;
      }

      .tag-item {
        padding: 6px 12px;
        font-size: 13px;
      }

      .tag-item.size-xl {
        font-size: 20px;
        padding: 10px 20px;
      }

      .tag-item.size-lg {
        font-size: 16px;
        padding: 8px 16px;
      }
    }

    /* Animations */
    @keyframes fadeInScale {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .tag-item {
      animation: fadeInScale 0.4s ease-out forwards;
      opacity: 0;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="header-inner">
        <a href="/" class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10" />
            <circle cx="12" cy="12" r="3" />
          </svg>
          Almagest
        </a>

        <nav class="nav">
          <a href="/" class="nav-link">首页</a>
          <a href="/archives" class="nav-link">归档</a>
          <a href="/categories" class="nav-link">分类</a>
          <a href="/tags" class="nav-link active">标签</a>
          <a href="/about" class="nav-link">关于</a>
        </nav>

        <div class="header-actions">
          <span class="moon-phase">🌙</span>
          <button class="theme-toggle">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="5" />
              <line x1="12" y1="1" x2="12" y2="3" />
              <line x1="12" y1="21" x2="12" y2="23" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Page Header -->
    <div class="page-header">
      <div class="page-header-inner">
        <h1 class="page-title">标签</h1>
        <p class="page-subtitle">共 156 个标签</p>
      </div>
    </div>

    <!-- Tags Content -->
    <div class="tags-content">
      <div class="tags-cloud">
        <!-- XL Size -->
        <a href="/tags/JavaScript" class="tag-item size-xl" style="animation-delay: 0.05s">
          JavaScript <span class="tag-count">48</span>
        </a>

        <!-- LG Size -->
        <a href="/tags/Vue" class="tag-item size-lg color-purple" style="animation-delay: 0.1s">
          Vue <span class="tag-count">32</span>
        </a>
        <a href="/tags/CSS" class="tag-item size-lg" style="animation-delay: 0.15s">
          CSS <span class="tag-count">28</span>
        </a>

        <!-- MD Size -->
        <a href="/tags/Node-js" class="tag-item size-md" style="animation-delay: 0.2s">
          Node.js <span class="tag-count">18</span>
        </a>
        <a href="/tags/React" class="tag-item size-md color-cyan" style="animation-delay: 0.25s">
          React <span class="tag-count">15</span>
        </a>
        <a href="/tags/TypeScript" class="tag-item size-md" style="animation-delay: 0.3s">
          TypeScript <span class="tag-count">14</span>
        </a>

        <!-- SM Size -->
        <a href="/tags/Git" class="tag-item size-sm" style="animation-delay: 0.35s">
          Git <span class="tag-count">12</span>
        </a>
        <a href="/tags/Docker" class="tag-item size-sm" style="animation-delay: 0.4s">
          Docker <span class="tag-count">10</span>
        </a>
        <a href="/tags/HTML" class="tag-item size-sm" style="animation-delay: 0.45s">
          HTML <span class="tag-count">9</span>
        </a>
        <a href="/tags/Python" class="tag-item size-sm color-cyan" style="animation-delay: 0.5s">
          Python <span class="tag-count">8</span>
        </a>
        <a href="/tags/前端" class="tag-item size-sm" style="animation-delay: 0.55s">
          前端 <span class="tag-count">7</span>
        </a>
        <a href="/tags/工具" class="tag-item size-sm color-purple" style="animation-delay: 0.6s">
          工具 <span class="tag-count">6</span>
        </a>
        <a href="/tags/随想" class="tag-item size-sm" style="animation-delay: 0.65s">
          随想 <span class="tag-count">5</span>
        </a>
        <a href="/tags/Linux" class="tag-item size-sm" style="animation-delay: 0.7s">
          Linux <span class="tag-count">4</span>
        </a>
        <a href="/tags/博客" class="tag-item size-sm color-purple" style="animation-delay: 0.75s">
          博客 <span class="tag-count">4</span>
        </a>
        <a href="/tags/API" class="tag-item size-sm" style="animation-delay: 0.8s">
          API <span class="tag-count">3</span>
        </a>
        <a href="/tags/性能优化" class="tag-item size-sm" style="animation-delay: 0.85s">
          性能优化 <span class="tag-count">3</span>
        </a>
        <a href="/tags/设计" class="tag-item size-sm" style="animation-delay: 0.9s">
          设计 <span class="tag-count">3</span>
        </a>
        <a href="/tags/面试" class="tag-item size-sm color-cyan" style="animation-delay: 0.95s">
          面试 <span class="tag-count">2</span>
        </a>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer-inner">
        <div class="footer-links">
          <a href="https://github.com/h1s97x" class="footer-link" target="_blank">GitHub</a>
          <a href="/atom.xml" class="footer-link">RSS</a>
          <a href="/search" class="footer-link">搜索</a>
        </div>
        <p class="footer-copyright">© 2024 Almagest Theme · 基于 Hexo · 精心打造</p>
      </div>
    </footer>
  </div>
</body>
</html>
