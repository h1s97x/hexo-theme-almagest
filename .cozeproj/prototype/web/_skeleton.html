<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/jquery/jquery-3.7.1.min.js"></script>
    <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/lucide/lucide-1.11.0.min.js"></script>
    <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/tailwindcss/tailwindcss-browser-4.2.4.min.js"></script>

    <style type="text/tailwindcss">
      @theme {
        /* === 品牌色 (星空蓝金色) === */
        --color-primary: #4a90d9;
        --color-primary-container: #1a3a5c;
        --color-on-primary: #ffffff;
        --color-secondary: #8b5cf6;
        --color-secondary-container: #2a1a48;
        --color-on-secondary: #ffffff;
        /* === 背景 / 表面 (深空色系) === */
        --color-background: #0a0e17;
        --color-surface-container-lowest: #0d1220;
        --color-surface: #12162a;
        --color-surface-container: #1a1f3a;
        --color-surface-container-high: #232842;
        --color-surface-container-highest: #2a3050;
        /* === 文字 === */
        --color-on-surface: #e8ecf4;
        --color-on-surface-variant: #a0aec0;
        /* === 功能色 === */
        --color-success: #10b981;
        --color-error: #ef4444;
        --color-warning: #f59e0b;
        /* === 边框 === */
        --color-outline: #2d3748;
        --color-outline-variant: #1e2433;
        /* === 圆角 === */
        --radius-sm: 0.25rem;
        --radius-md: 0.5rem;
        --radius-lg: 0.75rem;
        --radius-xl: 1rem;
        --radius-2xl: 1.5rem;
        --radius-full: 9999px;
        /* === 阴影 === */
        --shadow-card: 0 4px 12px rgba(0, 0, 0, 0.3);
        --shadow-float: 0 10px 25px rgba(0, 0, 0, 0.4);
        --shadow-dialog: 0 25px 50px rgba(0, 0, 0, 0.5);
        /* === 字体 === */
        --font-sans: 'Inter', 'Noto Sans SC', system-ui, sans-serif;
      }

      /* 星空背景效果 */
      .starry-bg {
        background:
          radial-gradient(ellipse at 20% 80%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
          radial-gradient(ellipse at 80% 20%, rgba(74, 144, 217, 0.1) 0%, transparent 50%),
          radial-gradient(ellipse at 50% 50%, rgba(26, 26, 58, 1) 0%, rgba(10, 14, 23, 1) 100%);
      }

      /* 星星动画 */
      @keyframes twinkle {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }

      .star {
        position: absolute;
        background: white;
        border-radius: 50%;
        animation: twinkle 3s ease-in-out infinite;
      }

      /* 毛玻璃效果 */
      .glass {
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
    </style>

    <!-- 图片兜底 -->
    <script>
      document.addEventListener(
        'error',
        function (e) {
          const img = e.target;
          if (img.tagName !== 'IMG' || img.dataset.fallback) return;
          img.dataset.fallback = '1';
          const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          const cat = img.getAttribute('data-category') || '其他';
          const alt = img.getAttribute('alt') || '';
          const label = esc(alt.length > 8 ? alt.slice(0, 8) + '…' : alt);
          const icons = {
            人物: '👤',
            自然风景: '🏞',
            动物: '🐾',
            建筑城市: '🏙',
            运动体育: '⚽',
            交通工具: '🚗',
            食物: '🍽',
            服饰时尚: '👗',
            商业科技: '💼',
            游戏娱乐: '🎮',
            艺术: '🎨',
            其他: '🖼'
          };
          const icon = icons[cat] || '🖼';
          const w = img.width || 400,
            h = img.height || 300;
          const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" fill="%23f3f4f6"/><text x="50%" y="45%" text-anchor="middle" font-size="${Math.min(w, h) * 0.18}" dominant-baseline="central">${icon}</text><text x="50%" y="68%" text-anchor="middle" font-size="${Math.min(w, h) * 0.07}" fill="%239ca3af" font-family="system-ui,sans-serif" dominant-baseline="central">${label}</text></svg>`;
          img.src = 'data:image/svg+xml,' + svg;
        },
        true
      );
    </script>
  </head>

  <body class="bg-background text-on-surface min-h-screen starry-bg relative overflow-x-hidden">
    <!-- 顶部星星装饰 -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
      <div class="star w-1 h-1 top-[10%] left-[15%]" style="animation-delay: 0s"></div>
      <div class="star w-1.5 h-1.5 top-[20%] left-[80%]" style="animation-delay: 1s"></div>
      <div class="star w-1 h-1 top-[40%] left-[25%]" style="animation-delay: 2s"></div>
      <div class="star w-0.5 h-0.5 top-[60%] left-[70%]" style="animation-delay: 0.5s"></div>
      <div class="star w-1 h-1 top-[80%] left-[40%]" style="animation-delay: 1.5s"></div>
      <div class="star w-0.5 h-0.5 top-[30%] left-[90%]" style="animation-delay: 2.5s"></div>
      <div class="star w-1 h-1 top-[70%] left-[10%]" style="animation-delay: 0.8s"></div>
      <div class="star w-1.5 h-1.5 top-[50%] left-[55%]" style="animation-delay: 1.8s"></div>
    </div>

    <!-- @nav:start 导航组件 -->
    <header class="sticky top-0 z-50 glass bg-surface/80 border-b border-outline/30">
      <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
        <!-- Logo -->
        <a href="home.html" class="flex items-center gap-2 hover:opacity-80 transition-opacity">
          <svg class="w-8 h-8 text-primary" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"
            />
          </svg>
          <span class="font-bold text-lg text-on-surface">Almagest</span>
        </a>

        <!-- 导航 -->
        <nav class="flex items-center gap-1">
          <a
            href="home.html"
            class="px-4 py-2 text-sm font-medium text-primary bg-primary/10 rounded-md"
            aria-current="page"
            >首页</a
          >
          <a
            href="archive.html"
            class="px-4 py-2 text-sm font-medium text-on-surface-variant hover:text-on-surface hover:bg-surface-container rounded-md transition-colors"
            >归档</a
          >
          <a
            href="categories.html"
            class="px-4 py-2 text-sm font-medium text-on-surface-variant hover:text-on-surface hover:bg-surface-container rounded-md transition-colors"
            >分类</a
          >
          <a
            href="tags.html"
            class="px-4 py-2 text-sm font-medium text-on-surface-variant hover:text-on-surface hover:bg-surface-container rounded-md transition-colors"
            >标签</a
          >
          <a
            href="about.html"
            class="px-4 py-2 text-sm font-medium text-on-surface-variant hover:text-on-surface hover:bg-surface-container rounded-md transition-colors"
            >关于</a
          >
        </nav>

        <!-- 操作按钮 -->
        <div class="flex items-center gap-2">
          <!-- 主题切换 -->
          <button
            class="p-2 rounded-md text-on-surface-variant hover:text-on-surface hover:bg-surface-container transition-colors"
            aria-label="切换主题"
          >
            <i data-lucide="moon" class="w-5 h-5"></i>
          </button>
          <!-- 搜索 -->
          <button
            class="p-2 rounded-md text-on-surface-variant hover:text-on-surface hover:bg-surface-container transition-colors"
            aria-label="搜索"
          >
            <i data-lucide="search" class="w-5 h-5"></i>
          </button>
        </div>
      </div>
    </header>
    <!-- @nav:end 导航组件 -->

    <!-- @main-content:start -->
    <main class="relative z-10 max-w-4xl mx-auto px-6 py-8">
      <!-- 页面内容将在这里填充 -->
    </main>
    <!-- @main-content:end -->

    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
