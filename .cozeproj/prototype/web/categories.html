<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>分类 - Almagest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-tertiary: #1a1a24;
      --text-primary: #e8e8ed;
      --text-secondary: #8b8b99;
      --text-tertiary: #5c5c6d;
      --accent-primary: #7c9cf0;
      --accent-secondary: #c9a0ff;
      --accent-glow: rgba(124, 156, 240, 0.3);
      --border-primary: rgba(255, 255, 255, 0.08);
      --font-sans: "Inter", "Noto Sans SC", -apple-system, sans-serif;
      --content-width: 800px;
      --content-padding: 24px;
      --transition-fast: 150ms ease-out;
      --transition-normal: 250ms ease-out;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.8;
      color: var(--text-primary);
      background-color: var(--bg-primary);
      min-height: 100vh;
    }

    a {
      color: var(--text-primary);
      text-decoration: none;
      transition: color var(--transition-fast);
    }

    a:hover {
      color: var(--accent-primary);
    }

    /* Header */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: rgba(10, 10, 15, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-primary);
    }

    .header-inner {
      max-width: var(--content-width);
      margin: 0 auto;
      padding: 0 var(--content-padding);
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 32px;
    }

    .nav-link {
      font-size: 14px;
      color: var(--text-secondary);
      transition: color var(--transition-fast);
    }

    .nav-link:hover,
    .nav-link.active {
      color: var(--accent-primary);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .moon-phase {
      font-size: 20px;
      cursor: pointer;
      opacity: 0.7;
    }

    .theme-toggle {
      width: 32px;
      height: 32px;
      border: none;
      background: var(--bg-tertiary);
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      transition: all var(--transition-fast);
    }

    /* Page Header */
    .page-header {
      padding: 120px var(--content-padding) 60px;
      text-align: center;
    }

    .page-header-inner {
      max-width: var(--content-width);
      margin: 0 auto;
    }

    .page-title {
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 16px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .page-subtitle {
      font-size: 16px;
      color: var(--text-secondary);
    }

    /* Categories Grid */
    .categories-content {
      max-width: var(--content-width);
      margin: 0 auto;
      padding: 0 var(--content-padding) 80px;
    }

    .categories-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
    }

    .category-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-primary);
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      transition: all var(--transition-normal);
      cursor: pointer;
    }

    .category-card:hover {
      border-color: var(--accent-primary);
      transform: translateY(-4px);
      box-shadow: 0 8px 32px var(--accent-glow);
    }

    .category-icon {
      font-size: 32px;
      margin-bottom: 12px;
      display: block;
    }

    .category-name {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    .category-count {
      font-size: 14px;
      color: var(--text-tertiary);
    }

    .category-count span {
      font-size: 24px;
      font-weight: 700;
      color: var(--accent-primary);
      display: block;
      margin-bottom: 4px;
    }

    /* Footer */
    .footer {
      padding: 40px var(--content-padding);
      border-top: 1px solid var(--border-primary);
      text-align: center;
    }

    .footer-inner {
      max-width: var(--content-width);
      margin: 0 auto;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-bottom: 16px;
    }

    .footer-link {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .footer-copyright {
      font-size: 13px;
      color: var(--text-tertiary);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .nav {
        display: none;
      }

      .page-header {
        padding: 100px 20px 40px;
      }

      .page-title {
        font-size: 28px;
      }

      .categories-content {
        padding: 0 20px 60px;
      }

      .categories-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .category-card {
        padding: 16px;
      }

      .category-icon {
        font-size: 24px;
      }

      .category-name {
        font-size: 14px;
      }
    }

    /* Animations */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .category-card {
      animation: fadeInUp 0.4s ease-out forwards;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="header-inner">
        <a href="/" class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10" />
            <circle cx="12" cy="12" r="3" />
          </svg>
          Almagest
        </a>

        <nav class="nav">
          <a href="/" class="nav-link">首页</a>
          <a href="/archives" class="nav-link">归档</a>
          <a href="/categories" class="nav-link active">分类</a>
          <a href="/tags" class="nav-link">标签</a>
          <a href="/about" class="nav-link">关于</a>
        </nav>

        <div class="header-actions">
          <span class="moon-phase">🌙</span>
          <button class="theme-toggle">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="5" />
              <line x1="12" y1="1" x2="12" y2="3" />
              <line x1="12" y1="21" x2="12" y2="23" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Page Header -->
    <div class="page-header">
      <div class="page-header-inner">
        <h1 class="page-title">分类</h1>
        <p class="page-subtitle">共 12 个分类</p>
      </div>
    </div>

    <!-- Categories Content -->
    <div class="categories-content">
      <div class="categories-grid">
        <a href="/categories/技术" class="category-card">
          <span class="category-icon">💻</span>
          <div class="category-name">技术</div>
          <div class="category-count">
            <span>28</span>
            篇文章
          </div>
        </a>

        <a href="/categories/随想" class="category-card">
          <span class="category-icon">🌟</span>
          <div class="category-name">随想</div>
          <div class="category-count">
            <span>12</span>
            篇文章
          </div>
        </a>

        <a href="/categories/教程" class="category-card">
          <span class="category-icon">📚</span>
          <div class="category-name">教程</div>
          <div class="category-count">
            <span>8</span>
            篇文章
          </div>
        </a>

        <a href="/categories/天文" class="category-card">
          <span class="category-icon">🔭</span>
          <div class="category-name">天文</div>
          <div class="category-count">
            <span>5</span>
            篇文章
          </div>
        </a>

        <a href="/categories/生活" class="category-card">
          <span class="category-icon">🌿</span>
          <div class="category-name">生活</div>
          <div class="category-count">
            <span>4</span>
            篇文章
          </div>
        </a>

        <a href="/categories/读书" class="category-card">
          <span class="category-icon">📖</span>
          <div class="category-name">读书</div>
          <div class="category-count">
            <span>3</span>
            篇文章
          </div>
        </a>

        <a href="/categories/工具" class="category-card">
          <span class="category-icon">🛠️</span>
          <div class="category-name">工具</div>
          <div class="category-count">
            <span>3</span>
            篇文章
          </div>
        </a>

        <a href="/categories/开源" class="category-card">
          <span class="category-icon">🚀</span>
          <div class="category-name">开源</div>
          <div class="category-count">
            <span>2</span>
            篇文章
          </div>
        </a>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer-inner">
        <div class="footer-links">
          <a href="https://github.com/h1s97x" class="footer-link" target="_blank">GitHub</a>
          <a href="/atom.xml" class="footer-link">RSS</a>
          <a href="/search" class="footer-link">搜索</a>
        </div>
        <p class="footer-copyright">© 2024 Almagest Theme · 基于 Hexo · 精心打造</p>
      </div>
    </footer>
  </div>
</body>
</html>
