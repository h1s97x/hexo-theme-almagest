main:
  push:
    - name: sync-to-github
      imports:
        - https://cnb.cool/h1s97x/secret-env/-/blob/main/env.yml
      stages:
        - name: sync to github
          image: tencentcom/git-sync
          settings:
            target_url: https://github.com/h1s97x/hexo-theme-almagest.git
            auth_type: https
            username: ${GITHUB_USERNAME}
            password: ${GITHUB_TOKEN}
            branch: main
            force: true
$:
  # 自动生成 Tag（在仓库 Tag 列表页点击「自动生成 Tag」按钮触发）
  # 基于 Conventional Commits 自动计算版本号并创建 vX.Y.Z 标签
  auto_tag:
    - name: auto-tag
      stages:
        - name: auto-tag
          image: cnbcool/git-auto-tag:latest
          settings:
            tagFormat: 'v\${version}'
            branch: $CNB_BRANCH
            repoUrlHttps: $CNB_REPO_URL_HTTPS
            blockWhenFail: false
          exports:
            tag: NEW_TAG
        - name: show generated tag
          script: 'echo "生成的新版本号: ${NEW_TAG:-（无变更，不生成）}"'

  # 推送 v* 标签后自动发布：质量检查 + 生成 CHANGELOG + 创建 Release + 发布 npm 制品
  tag_push:
    - name: release-and-publish
      stages:
        - name: generate-changelog
          image: cnbcool/changelog:latest
          settings:
            tag: $CNB_BRANCH
            target: CHANGELOG.generated.md

        - name: create-release
          type: git:release
          options:
            descriptionFromFile: CHANGELOG.generated.md
          exports:
            version: RELEASE_VERSION

        - name: publish-npm
          image: tencentcom/npm:latest
          settings:
            username: $CNB_TOKEN_USER_NAME
            token: $CNB_TOKEN
            email: $CNB_COMMITTER_EMAIL
            registry: https://npm.cnb.cool/h1s97x/toolkit/-/packages/
            folder: ./
            fail_on_version_conflict: true
