$:
  push:
    - name: quality-and-smoke
      docker:
        image: node:20
      stages:
        - name: install-deps
          script: |
            set -e
            npm install --no-audit --no-fund
        - name: lint-js
          script: |
            set -e
            npm run lint
        - name: stylelint
          script: |
            set -e
            npm run style:lint
        - name: unit-test
          script: |
            set -e
            npm run test:unit
        - name: smoke-test
          script: |
            set -e
            bash test/ci-smoke-test.sh
  pull_request:
    - name: quality-and-smoke
      docker:
        image: node:20
      stages:
        - name: install-deps
          script: |
            set -e
            npm install --no-audit --no-fund
        - name: lint-js
          script: |
            set -e
            npm run lint
        - name: stylelint
          script: |
            set -e
            npm run style:lint
        - name: unit-test
          script: |
            set -e
            npm run test:unit
        - name: smoke-test
          script: |
            set -e
            bash test/ci-smoke-test.sh
