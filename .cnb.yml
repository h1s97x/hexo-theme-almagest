main:
  push:
    - name: quality-and-smoke
      docker:
        image: node:20
      stages:
        - name: install-deps
          script: |
            set -e
            npm install --no-audit --no-fund
        - name: lint-js
          script: |
            set -e
            npm run lint
        - name: stylelint
          script: |
            set -e
            npm run style:lint
        - name: unit-test
          script: |
            set -e
            npm run test:unit
        - name: smoke-test
          script: |
            set -e
            bash test/ci-smoke-test.sh
    - name: sync-to-github
      # 敏感信息（GITHUB_USERNAME / GITHUB_TOKEN）存放在密钥仓库 secret-env，通过 imports 引用
      imports:
        - https://cnb.cool/h1s97x/secret-env/-/blob/main/env.yml
      stages:
        - name: sync to github
          image: tencentcom/git-sync
          settings:
            target_url: https://github.com/h1s97x/hexo-theme-almagest.git
            auth_type: https
            username: ${GITHUB_USERNAME}
            password: ${GITHUB_TOKEN}
            branch: main
            force: true
  pull_request:
    - name: quality-and-smoke
      docker:
        image: node:20
      stages:
        - name: install-deps
          script: |
            set -e
            npm install --no-audit --no-fund
        - name: lint-js
          script: |
            set -e
            npm run lint
        - name: stylelint
          script: |
            set -e
            npm run style:lint
        - name: unit-test
          script: |
            set -e
            npm run test:unit
        - name: smoke-test
          script: |
            set -e
            bash test/ci-smoke-test.sh
$:
  # 自动生成 Tag（在仓库 Tag 列表页点击「自动生成 Tag」按钮触发）
  # 基于 Conventional Commits 自动计算版本号并创建 vX.Y.Z 标签
  auto_tag:
    - name: auto-tag
      stages:
        - name: auto-tag
          image: cnbcool/git-auto-tag:latest
          settings:
            tagFormat: 'v\${version}'
            branch: $CNB_BRANCH
            repoUrlHttps: $CNB_REPO_URL_HTTPS
            blockWhenFail: false
          exports:
            tag: NEW_TAG
        - name: show generated tag
          script: 'echo "生成的新版本号: ${NEW_TAG:-（无变更，不生成）}"'

  # 推送 v* 标签后自动发布：质量检查 + 生成 CHANGELOG + 创建 Release + 发布 npm 制品
  tag_push:
    - name: release-and-publish
      docker:
        image: node:20
      stages:
        - name: install-deps
          script: |
            set -e
            npm install --no-audit --no-fund

        - name: run-checks
          script: |
            set -e
            npm run check
            npm run test:unit
            bash test/ci-smoke-test.sh

        - name: generate-changelog
          image: cnbcool/changelog:latest
          settings:
            tag: $CNB_BRANCH
            target: CHANGELOG.generated.md

        - name: create-release
          type: git:release
          options:
            descriptionFromFile: CHANGELOG.generated.md
          exports:
            version: RELEASE_VERSION

        - name: publish-npm
          image: tencentcom/npm:latest
          settings:
            username: $CNB_TOKEN_USER_NAME
            token: $CNB_TOKEN
            email: $CNB_COMMITTER_EMAIL
            registry: https://npm.cnb.cool/h1s97x/toolkit/-/packages/
            folder: ./
            fail_on_version_conflict: true

  # 部署 Demo 站点到 EdgeOne Pages（通过仓库「部署」入口触发，配置见 .cnb/tag_deploy.yml）
  tag_deploy.production:
    - name: deploy-demo-site
      imports:
        - https://cnb.cool/h1s97x/secret-env/-/blob/main/env.yml
      stages:
        - name: build-demo
          script: |
            set -e
            bash tools/build-demo.sh
        - name: deploy-to-edgeone-pages
          image: tencentcom/deploy-eopages:latest
          settings:
            project_name: hexo-theme-almagest-demo
            api_token: $EDGEONE_PAGES_API_TOKEN
            directory: .demo/public
            environment: production

  issue.open:
    - name: auto-assign-issue-owner
      docker:
        image: python:3.12-slim
      env:
        ISSUE_ASSIGNEE: h1s97x
      stages:
        - name: assign issue to owner
          script: |
            set -e
            python3 - <<'PYEOF'
            import json
            import os
            import urllib.request

            repo = os.environ["CNB_REPO_SLUG"]
            number = os.environ["CNB_ISSUE_IID"]
            owner = os.environ["ISSUE_ASSIGNEE"]
            token = os.environ["CNB_TOKEN"]
            api = os.environ.get("CNB_API_ENDPOINT", "https://api.cnb.cool").rstrip("/")
            base = f"{api}/{repo}/-/issues/{number}/assignees"

            def request(path, method="GET", data=None):
                headers = {
                    "Authorization": f"Bearer {token}",
                    "Accept": "application/json",
                }
                body = None
                if data is not None:
                    body = json.dumps(data).encode()
                    headers["Content-Type"] = "application/json"
                req = urllib.request.Request(path, data=body, method=method, headers=headers)
                with urllib.request.urlopen(req) as resp:
                    return resp.status, resp.read().decode()

            # 1. 查询当前处理人，已分配则跳过
            try:
                _, raw = request(base)
                assignees = json.loads(raw) if raw else []
                names = [a.get("username") for a in assignees] if isinstance(assignees, list) else []
                if owner in names:
                    print(f"[skip] issue already assigned to {owner}")
                    raise SystemExit(0)
            except SystemExit:
                raise
            except Exception as e:
                print(f"[warn] query assignees failed: {e}")

            # 2. 添加处理人
            status, _ = request(base, method="POST", data={"assignees": [owner]})
            print(f"[ok] assigned {owner} to issue #{number}, status={status}")
            PYEOF
