# Hexo Theme Almagest Configuration
# ==================================
# 星空主题配置 - 专为天文爱好者设计的优雅博客主题

# ============================================================
# 基础配置 (Basic Configuration)
# ============================================================

# 主题名称
title: 'H1S97X'

# 副标题
subtitle: '技术分享与生活记录 | 或有月下赏花人 应无所憾'

# 网站描述
description: '专注于技术开发、系统运维、游戏世界和学术学习的个人博客'

# 作者名称
author: 'H1S97X'

# 网站语言
language: zh-CN

# ============================================================
# 样式配置 (Style Configuration)
# ============================================================

style:
  # 主题色 (星空蓝)
  primary_color: '#4a90d9'

  # 强调色 (星青色)
  accent_color: '#06b6d4'

  # 主题偏好: auto | light | dark
  # auto: 根据系统设置自动切换
  # light: 始终使用亮色主题
  # dark: 始终使用暗色主题
  prefers_theme: 'dark'

  # 启用星空背景效果 (仅暗色主题)
  enable_starry_background: true

  # 启用平滑过渡
  smooth_transition: true

  # 代码块主题: atom-one-light | atom-one-dark | github | monokai
  code_theme: 'atom-one-dark'

# ============================================================
# 字体配置 (Font Configuration)
# 参考 Fluid 主题设计
# ============================================================

font:
  # 全局字体大小
  font_size: 16px

  # 全局字体族，留空则使用系统默认
  # 示例: "'Helvetica Neue', Arial, sans-serif"
  font_family:

  # 代码字体大小 (百分比)
  code_font_size: 85%

  # 字母间距
  letter_spacing: 0.02em

# ============================================================
# 导航栏配置 (Navbar Configuration)
# ============================================================

navbar:
  # 导航栏毛玻璃特效
  # 实验性功能，可能造成页面滚动掉帧
  ground_glass:
    enable: false
    # 模糊像素，数字越大越模糊
    px: 3
    # 不透明度 (0-1)，注意透明过度可能看不清菜单字体
    alpha: 0.7

# ============================================================
# 滚动条配置 (Scrollbar Configuration)
# ============================================================

scrollbar:
  # 是否启用自定义滚动条样式
  enable: true

# ============================================================
# 导航菜单配置 (Navigation Menu)
# ============================================================

menu:
  首页: /
  归档: /blog/archives/
  分类: /blog/categories/
  标签: /blog/tags/
  工具:
    - 工具1: /tools/tool1/
    - 工具2: /tools/tool2/
    - 工具3: /tools/tool3/
  关于: /about/

# ============================================================
# 侧边栏配置 (Sidebar Configuration)
# ============================================================

sidebar:
  # 是否启用侧边栏
  enable: true

  # 侧边栏位置: left | right
  position: right

  # 侧边栏宽度 (像素)
  width: 280

  # 侧边栏组件
  widgets:
    - about
    - recent-posts
    - categories
    - tags

# ============================================================
# 功能开关 (Feature Toggles)
# ============================================================

features:
  # 搜索功能
  search: true

  # 评论系统
  comments: true

  # 目录 (Table of Contents)
  toc: true

  # 代码复制按钮
  code_copy: true

  # 返回顶部按钮
  back_to_top: true

  # 阅读时间估计
  reading_time: true

  # 文章字数统计
  word_count: true

  # 滚动动画（元素进入视口时触发淡入动画）
  scroll_animation: true

  # Pjax 无刷新导航
  # 启用后页面切换将使用无刷新加载，提升体验
  pjax: true

  # 阅读模式
  # 一键切换到专注阅读的干净界面
  reading_mode: true

# ============================================================
# Pjax 加载动画配置 (Pjax Loading Animation)
# 参考 Fluid 主题的 NProgress 实现
# ============================================================

pjax_loading:
  # 是否启用 Pjax 加载进度条
  enable: true

  # 进度条颜色
  color: '#29d'

  # 进度条高度 (像素)
  height: 3

  # 是否显示加载图标 (Safari 兼容)
  show_spinner: false

  # NProgress 配置 (高级选项)
  # 参考: https://github.com/rstacruz/nprogress
  options:
    # 缓慢开始
    trickle: true
    # 缓慢速度
    trickle_speed: 100
    # 缓动函数
    easing: 'ease'
    # 动画速度 (毫秒)
    speed: 200
    # 最小百分比
    minimum: 0.08

# ============================================================
# 首页 Banner 配置 (Home Page Banner)
# ============================================================

index:
  # 首页 Banner 头图
  # 可以是相对路径或绝对路径
  banner_img: /images/banner.jpg

  # Banner 高度 (屏幕百分比, 0-100)
  banner_img_height: 100

  # Banner 黑色蒙版不透明度 (0-1.0)
  banner_mask_alpha: 0.3

  # 是否开启随机头图
  # 开启后将 source/images/random/ 目录下的图片随机作为 Banner
  random_img: false

  # 视差滚动效果
  parallax: true

  # 首页副标题打字机效果
  slogan:
    enable: true
    # 为空则使用上方 subtitle 配置
    text: ''
    # 打字速度 (数字越大越慢)
    typeSpeed: 70
    # 游标字符
    cursorChar: '_'
    # 是否循环
    loop: false

  # 自动截取文章摘要
  auto_excerpt:
    enable: true
    length: 200

  # 文章元信息展示
  post_meta:
    date: true
    category: true
    tag: true

  # 文章置顶标识
  post_sticky:
    enable: true
    icon: 'top'

# ============================================================
# 文章页配置 (Post Page)
# ============================================================

post:
  banner_img: /images/banner.jpg
  banner_img_height: 70
  banner_mask_alpha: 0.3

  # 文章目录 (TOC) 配置
  toc:
    enable: true
    # 是否默认展开全部目录
    expand_all: true
    # 目录位置: left | right
    placement: right
    # 目录标题层级
    headingSelector: 'h1,h2,h3,h4,h5,h6'
    # 折叠深度 (0 为全部折叠)
    collapseDepth: 0

  # 版权声明
  copyright:
    enable: true
    # 协议类型: BY | BY-SA | BY-ND | BY-NC | BY-NC-SA | BY-NC-ND | ZERO
    license: 'BY'
    # 显示作者
    show_author: true
    # 显示发布日期
    show_date: true
    # 显示更新日期
    show_update_date: false

  # 上一篇/下一篇导航
  prev_next:
    enable: true

  # 文章图片可点击放大
  image_zoom:
    enable: true
    # 放大后图片链接替换规则
    # 例如: ['-slim', ''] 将链接中 `-slim` 移除
    img_url_replace: ['', '']

  # 脚注语法
  footnote:
    enable: true
    header: ''

# ============================================================
# 404 页面配置 (404 Page)
# ============================================================

page404:
  enable: true
  banner_img: /images/banner.jpg
  banner_img_height: 85
  banner_mask_alpha: 0.3
  # 重定向到首页的延迟 (毫秒), 0 为不跳转
  redirect_delay: 5000

# ============================================================
# 关于页面配置 (About Page)
# ============================================================

about:
  enable: true
  banner_img: /images/banner.jpg
  banner_img_height: 60
  banner_mask_alpha: 0.3
  # 头像
  avatar: /images/avatar.jpg
  # 名称 (为空则使用 site.author)
  name: ''
  # 简介
  intro: ''
  # 社交图标 (class 为图标 CSS class)
  icons:
    # - { class: "iconfont icon-github-fill", link: "https://github.com", tip: "GitHub" }
    # - { class: "iconfont icon-wechat-fill", qrcode: "/images/wechat.jpg" }

# ============================================================
# 社交链接 (Social Links)
# ============================================================

social:
  # GitHub
  github: 'https://github.com/h1s97x'

  # Twitter
  twitter: ''

  # 微博
  weibo: ''

  # 知乎
  zhihu: ''

  # 邮箱
  email: ''

# ============================================================
# 第三方服务 (Third-party Services)
# ============================================================

services:
  # Giscus 评论系统
  giscus:
    enable: false
    repo: ''
    repo_id: ''
    category: 'Announcements'
    category_id: ''
    mapping: 'pathname'
    reactions_enabled: true
    emit_metadata: false
    input_position: 'bottom'
    theme: 'dark'
    lang: 'zh-CN'
    loading: 'lazy'

  # Google Analytics
  google_analytics:
    enable: false
    tracking_id: ''

  # 百度统计
  baidu_analytics:
    enable: false
    tracking_id: ''

# ============================================================
# 分页配置 (Pagination Configuration)
# ============================================================

pagination:
  # 每页文章数
  per_page: 8

  # 分页类型: pagination | infinite
  type: 'pagination'

# ============================================================
# 文章配置 (Article Configuration)
# ============================================================

article:
  # 文章摘要长度 (字符数)
  excerpt_length: 200

  # 是否显示文章更新时间
  show_updated: true

  # 是否显示阅读时间
  show_reading_time: true

  # 是否显示字数统计
  show_word_count: true

  # 日期格式
  date_format: 'YYYY-MM-DD'

  # 阅读时间计算配置
  reading_time:
    # 平均每个字的阅读时间 (毫秒)
    # 中文约 200-300 字/分钟，英文约 100-150 词/分钟
    # 默认中文 200 字/分钟，英文 100 词/分钟
    awl: 2
    # 每分钟阅读字数
    wpm: 60

# ============================================================
# 图标库配置 (Icon Library Configuration)
# ============================================================

# 阿里图标库 (Iconfont)
# 获取方式：https://www.iconfont.cn/
# 1. 在 iconfont 搜索并添加图标到购物车
# 2. 进入购物车，点击"添加至项目"
# 3. 创建/选择项目，勾选"Font class"并生成代码
# 4. 复制生成的 CSS 地址填入下方
iconfont: ''

# ============================================================
# 图片配置 (Image Configuration)
# ============================================================

image:
  # 启用图片懒加载
  lazy_load: true

  # 图片懒加载时的占位图
  # 支持本地路径 (/img/loading.gif) 或 URL
  # 留空则使用纯色占位
  loading_img: ''

  # 图片占位符颜色 (当 loading_img 为空时使用)
  placeholder_color: '#1a1a2e'

  # 默认文章封面 (留空则不显示)
  default_cover: ''

  # 图片灯箱
  # 点击文章中的图片可放大查看
  lightbox: true

# ============================================================
# 天文主题配置 (Astronomy Theme Configuration)
# ============================================================

astronomy:
  # 启用天文主题组件
  enable: true

  # 星星动画速度: slow | normal | fast
  animation_speed: 'normal'

  # 显示星座导航
  show_constellation_nav: false

  # 显示天文日历
  show_astronomy_calendar: false

# ============================================================
# 自定义注入 (Custom Injection)
# ============================================================

# 在 <head> 中注入自定义代码
inject:
  head: |
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  # 在 </body> 前注入自定义代码
  body_end: ''

# ============================================================
# RSS 配置 (RSS Configuration)
# ============================================================

rss:
  # 是否启用 RSS
  enable: true

  # RSS 路径
  path: 'atom.xml'

  # RSS 标题
  title: ''

  # RSS 描述
  description: ''

  # RSS 作者
  author: ''

# ============================================================
# 友链配置 (Friends Links Configuration)
# ============================================================

friends:
  # 是否启用友链功能
  enable: false

  # 友链页面标题
  title: '友情链接'

  # 友链列表
  links:
    # 示例:
    # - name: "博客名称"
    #   url: "https://example.com"
    #   avatar: "https://example.com/avatar.png"
    #   description: "博客描述"

# ============================================================
# SEO 配置 (SEO Configuration)
# ============================================================

seo:
  # 是否启用 SEO 优化
  enable: true

  # Google SEO
  google:
    # Google 站点验证
    site_verification: ''

    # Google Analytics 追踪 ID
    tracking_id: ''

  # 百度 SEO
  baidu:
    # 百度站点验证
    site_verification: ''

    # 百度统计追踪 ID
    tracking_id: ''

  # Open Graph
  open_graph:
    enable: true
    twitter_card: true
    twitter_id: ''
    twitter_site: ''

  # 优先级设置
  priority:
    homepage: 1.0
    post: 0.8
    page: 0.6
    archive: 0.5
    category: 0.4
    tag: 0.4

# ============================================================
# 文章目录配置 (Table of Contents Configuration)
# ============================================================

toc:
  # 是否启用文章目录
  enable: true

  # 目录位置: left | right
  position: 'right'

  # 目录宽度 (像素)
  width: 260

  # 是否在移动端显示
  mobile: false

  # 是否自动编号
  list_number: true

  # 目录标题
  title: '目录'

  # 最小深度 (h2-h6)
  min_depth: 2

  # 最大深度 (h2-h6)
  max_depth: 6

  # 是否折叠
  collapse: false

# ============================================================
# 阅读进度条配置 (Reading Progress Configuration)
# ============================================================

reading_progress:
  # 是否启用阅读进度条
  enable: true

  # 进度条位置: top | bottom
  position: 'top'

  # 进度条高度 (像素)
  height: 3

  # 进度条颜色
  color: '#4a90d9'

  # 是否显示百分比
  show_percent: false

# ============================================================
# 代码高亮配置 (Code Highlight Configuration)
# ============================================================

highlight:
  # 是否启用代码高亮
  enable: true

  # 代码高亮主题
  # 浅色主题: github, github-dark, atom-one-light, vs, xcode, vs2015
  # 深色主题: atom-one-dark, monokai, dracula, nord, github-dark, one-dark-pro
  light_theme: 'github'
  dark_theme: 'atom-one-dark'

  # 是否显示行号
  line_number: true

  # 代码块标题
  code_block_title: true

  # 代码复制按钮
  copy_button: true

  # 复制按钮样式: flat | hover
  copy_style: 'hover'

  # 代码块语言标签
  show_lang: true

# ============================================================
# 数学公式配置 (Math Configuration)
# ============================================================

math:
  # 是否启用数学公式支持
  enable: true

  # 公式渲染引擎: mathjax | katex
  engine: 'katex'

  # 是否在首页/归档页渲染公式
  render_on_all_pages: false

  # KaTeX 配置 (engine: katex 时生效)
  katex:
    # KaTeX CSS 版本
    version: '0.16.9'

    # 是否加载 KaTeX JS (可选，如果使用插件可以不加载)
    load_js: true

    # KaTeX 配置选项
    options:
      # 是否显示加载错误
      throwError: false
      # 错误处理方式: warn | error | false
      errorColor: '#cc0000'

  # MathJax 配置 (engine: mathjax 时生效)
  mathjax:
    # MathJax 版本
    version: '3'

    # 配置选项
    options:
      # 是否启用右键菜单
      enableMenu: true

      # TeX 扩展
      tex:
        inlineMath: [['$', '$'], ["\\(", "\\)"]]
        displayMath: [['$$', '$$'], ["\\[", "\\]"]]

      # SVG 输出
      svg:
        fontCache: 'global'

    # 是否使用 CDN
    cdn: 'jsdelivr'

# ============================================================
# Mermaid 图表配置 (Mermaid Configuration)
# ============================================================

mermaid:
  # 是否启用 Mermaid 图表支持
  enable: true

  # Mermaid 版本
  version: '10.6.1'

  # 主题: default, dark, forest, neutral, null
  theme: 'default'

  # 深色主题
  dark_theme: 'dark'

  # 配置选项
  options:
    # 安全模式
    securityLevel: 'loose'
    # 是否启用字体图标
    fontFamily: 'Arial, sans-serif'
    # 流程图方向: TB, BT, LR, RL
    flowchart:
      curve: 'basis'
    # 时序图配置
    sequence:
      useMaxWidth: true
      diagramMaxWidth: 800

# ============================================================
# 访问统计配置 (Analytics Configuration)
# ============================================================

analytics:
  # 是否启用访问统计
  enable: true

  # 统计服务: busuanzi | google | custom
  service: 'busuanzi'

  # 不蒜子统计 (国内推荐)
  busuanzi:
    # 站点 UV
    site_uv: true
    # 站点 PV
    site_pv: true
    # 文章 PV
    page_pv: true
    # 不蒜子版本
    version: '2.3'

  # Google Analytics
  google:
    # 追踪 ID
    tracking_id: ''
    # 匿名化 IP
    anonymize_ip: true

# ============================================================
# 高级配置 (Advanced Configuration)
# ============================================================

# 启用调试模式
debug: false

# 自定义 CDN 前缀
cdn_prefix: ''

# 资源版本号 (用于缓存清除)
version: '1.0.0'

# 自定义 CSS 类
custom_css_class: ''

# 是否启用平滑滚动
smooth_scroll: true

# 文章特色图片
feature:
  # 是否启用特色图片
  enable: true
  # 默认占位图
  placeholder: ''

# 图片灯箱配置
fancybox:
  enable: true
  auto_hook: true

# ============================================================
# 归档页配置 (Archive Page Configuration)
# ============================================================

archive:
  # Banner 图片
  banner_img: /images/banner.jpg
  # Banner 高度 (屏幕百分比)
  banner_img_height: 60
  # Banner 遮罩透明度
  banner_mask_alpha: 0.3

# ============================================================
# 分类页配置 (Category Page Configuration)
# ============================================================

category:
  # 是否启用分类页
  enable: true
  # Banner 图片
  banner_img: /images/banner.jpg
  # Banner 高度
  banner_img_height: 60
  # Banner 遮罩透明度
  banner_mask_alpha: 0.3
  # 分类排序: -length | name
  order_by: '-length'
  # 折叠深度，0 全部折叠
  collapse_depth: 0
  # 文章排序
  post_order_by: '-date'
  # 单个分类中最大显示文章数
  post_limit: 10

# ============================================================
# 标签页配置 (Tag Page Configuration)
# ============================================================

tag:
  # 是否启用标签页
  enable: true
  # Banner 图片
  banner_img: /images/banner.jpg
  # Banner 高度
  banner_img_height: 80
  # Banner 遮罩透明度
  banner_mask_alpha: 0.3
  # 标签云字体大小范围
  tagcloud:
    min_font: 15
    max_font: 30
    unit: px
    start_color: '#BBBBEE'
    end_color: '#337ab7'
  # 标签云颜色数组（支持自定义）
  # 根据标签名称自动分配颜色
  colors:
    - '#4a90d9' # 蓝色
    - '#50c1e9' # 天蓝色
    - '#72d5a4' # 绿色
    - '#f6a623' # 橙色
    - '#f56368' # 红色
    - '#a855f7' # 紫色
    - '#ec4899' # 粉色

# ============================================================
# 友链页面配置 (Links Page Configuration)
# ============================================================

links:
  enable: true
  banner_img: /images/banner.jpg
  banner_img_height: 60
  banner_mask_alpha: 0.3
  items:
    - title: 'Fluid Blog'
      intro: 'Fluid 主题博客'
      link: 'https://hexo.fluid-dev.com/'
      avatar: '/images/avatar.png'
  # 头像加载失败时的替换图片
  onerror_avatar: /images/avatar.png
  # 友链下方自定义区域
  custom:
    enable: false
    content: '<p>在下方留言申请加入我的友链</p>'

# ============================================================
# 自定义页面配置 (Custom Page Configuration)
# ============================================================

page:
  banner_img: /images/banner.jpg
  banner_img_height: 60
  banner_mask_alpha: 0.3

# ============================================================
# 暗色模式配置 (Dark Mode Configuration)
# ============================================================

# 暗色模式独立配置块，替代 style.prefers_theme
dark_mode:
  # 是否启用暗色模式切换
  enable: true
  # 默认模式: auto | light | dark
  # auto: 根据系统设置自动切换，18:00-06:00 自动进入暗色模式
  # light: 始终亮色
  # dark: 始终暗色
  default: auto

# ============================================================
# 颜色配置 (Color Configuration)
# 参考 Fluid 主题设计
# ============================================================

color:
  # body 背景色
  body_bg_color: '#f8f9fa'
  body_bg_color_dark: '#0f172a'
  # 导航栏背景色
  navbar_bg_color: 'rgba(255, 255, 255, 0.95)'
  navbar_bg_color_dark: 'rgba(15, 23, 42, 0.95)'
  # 导航栏文字色
  navbar_text_color: '#334155'
  navbar_text_color_dark: '#e2e8f0'
  # 主面板背景色
  board_color: '#ffffff'
  board_color_dark: '#1e293b'
  # 全局文字色
  text_color: '#334155'
  text_color_dark: '#cbd5e1'
  # 次级文字色 (摘要、简介等)
  sec_text_color: '#64748b'
  sec_text_color_dark: '#94a3b8'
  # 文章标题色
  post_heading_color: '#1e293b'
  post_heading_color_dark: '#e2e8f0'
  # 链接色
  link_color: '#0066cc'
  link_color_dark: '#60a5fa'
  # 链接悬浮色
  link_hover_color: '#4a90d9'
  link_hover_color_dark: '#93c5fd'
  # 链接悬浮背景色
  link_hover_bg_color: 'rgba(74, 144, 217, 0.1)'
  link_hover_bg_color_dark: 'rgba(96, 165, 250, 0.15)'
  # 分隔线颜色
  line_color: '#e2e8f0'
  line_color_dark: '#334155'
  # 按钮背景色
  button_bg_color: 'transparent'
  button_bg_color_dark: 'transparent'
  # 按钮悬浮背景色
  button_hover_bg_color: '#f1f5f9'
  button_hover_bg_color_dark: '#334155'

# ============================================================
# 静态资源 CDN 前缀配置 (Static Assets CDN)
# 参考 Fluid 主题设计
# 可自定义成 CDN 地址，如果不知道如何设置请不要改动
# ============================================================

static_prefix:
  # 内部静态资源
  internal_js: /js
  internal_css: /css
  internal_img: /images
  # Google Fonts
  google_fonts: https://fonts.googleapis.com
  # Highlight.js
  highlightjs: https://cdn.jsdelivr.net/npm/highlight.js
  # KaTeX
  katex: https://cdn.jsdelivr.net/npm/katex
  # MathJax
  mathjax: https://cdn.jsdelivr.net/npm/mathjax
  # Pjax
  pjax: https://cdn.jsdelivr.net/npm/pjax
  # NProgress (Pjax 加载进度条)
  nprogress: https://cdn.jsdelivr.net/npm/nprogress
  # Mermaid
  mermaid: https://cdn.jsdelivr.net/npm/mermaid
  # Busuanzi 统计
  busuanzi: https://busuanzi.ibruce.info/busuanzi
  # Font Awesome (可选)
  font_awesome: https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free

# ============================================================
# 旧配置兼容 (兼容性保留，建议迁移到新配置)
# ============================================================

# 以下配置保留向后兼容，新用户建议使用上方的新配置
# style.prefers_theme -> 请使用 dark_mode.default
# cdn_prefix -> 请使用 static_prefix.internal_js
