# ============================================================
# Hexo Theme Almagest — 主题配置文件
# ============================================================
# 本文件是主题的默认配置。安装主题后，可在 Hexo 站点根目录的
# `_config.yml` 中通过 `theme_config:` 覆盖任意配置项（无需复制整份文件），例如：
#
#   theme_config:
#     title: "My Blog"
#     style:
#       primary_color: "#7c3aed"
#     features:
#       search: false
#
# 站点级 `theme_config:` 会与主题默认配置深度合并。
# ============================================================

# ============================================================
# 基础配置
# ============================================================

# 站点名称（显示在导航栏 / 页脚 / 页面标题）
title: 'My Blog'

# 副标题（显示在首页）
subtitle: 'A minimal and elegant theme'

# 网站描述（用于 meta description 与侧边栏简介）
description: 'Personal blog powered by Hexo and Almagest Theme'

# 作者名称（用于 meta author 与页脚版权）
author: 'Your Name'

# 网站语言（对应 languages/ 下的语言包：en / zh-CN / zh-TW）
language: en

# 日期显示格式（用于文章卡片 / 详情页）
date_format: 'YYYY-MM-DD'

# ============================================================
# 样式配置
# ============================================================

style:
  # 主题色（十六进制颜色码）
  # 仅用于 <meta name="theme-color">（移动端浏览器 chrome 配色）。
  # 页面内的强调色由 CSS 运行时变量决定（亮色 #4f46e5 / 暗色 #67e8f9），
  # 此处与亮色主题保持一致即可，无需随页面变化。
  primary_color: '#4f46e5'

  # 主题偏好: auto | light | dark
  # auto: 根据系统设置自动切换
  # light: 始终使用亮色主题
  # dark: 始终使用暗色主题
  prefers_theme: 'auto'

  # 启用平滑过渡
  smooth_transition: true

  # 代码块主题: atom-one-light | atom-one-dark | github | monokai
  code_theme: 'atom-one-light'

# ============================================================
# 代码高亮（highlight.js）
# ============================================================
# 主题内置基于 highlight.js 的高亮方案；如设为 false 则使用 Hexo 自带高亮，
# 不加载任何外部 CDN 资源。

code_highlight:
  # 是否启用 highlight.js
  enable: true

  # highlight.js CDN 地址（包根地址，模板会拼接 /highlight.min.js 与 /styles/）
  #
  # ⚠️ 必须指向「浏览器构建产物」，不要改成 npm 的 highlight.js 包：
  #    highlight.js@x/lib/common.min.js 是 Node 专用入口（仅 2.5KB，内部调用 require()），
  #    在浏览器中会抛 "require is not defined"，window.hljs 始终为 undefined，
  #    结果是代码块完全没有语法着色。
  #    @highlightjs/cdn-assets 才是为浏览器准备的完整构建（含常用语言，约 129KB）。
  #
  #    国内网络可替换为镜像，例如：
  #      https://cdn.staticfile.net/highlight.js/11.12.0
  #      https://cdn.bootcdn.net/ajax/libs/highlight.js/11.12.0
  cdn: 'https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.12.0'

  # 高亮样式主题（与 style.code_theme 保持一致，二选一配置即可）
  theme: 'atom-one-light'

# ============================================================
# 字体
# ============================================================

fonts:
  # 是否加载 Google Fonts（国内网络不可用时建议设为 false）
  google_fonts: true

  # Google Fonts 加载地址（可替换为国内镜像，如 fonts.loli.net）
  google_fonts_url: 'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap'

# ============================================================
# 导航菜单配置
# ============================================================
# 格式: 显示名称: 路径（支持多级子菜单，见注释示例）

menu:
  Home: /
  Archives: /archives/
  Categories: /categories/
  Tags: /tags/
  About: /about/

# 高级菜单示例（取消注释即可使用）：
# menu:
#   Home: /
#   Archives: /archives/
#   分类:
#     - name: 前端
#       path: /categories/front-end/
#     - name: 后端
#       path: /categories/back-end/

# ============================================================
# 侧边栏配置
# ============================================================

sidebar:
  # 是否启用侧边栏
  enable: true

  # 侧边栏位置: left | right
  position: right

  # 侧边栏宽度 (像素)
  width: 300

# ============================================================
# 功能开关
# ============================================================

features:
  # 搜索功能（生成 /search/ 页面 + search.json）
  search: true

  # 评论系统（配合 services.giscus 使用）
  comments: true

  # 目录 (Table of Contents)
  toc: true

  # 代码复制按钮
  code_copy: true

  # 返回顶部按钮
  back_to_top: true

  # 阅读时间估计
  reading_time: true

  # 文章卡片是否显示摘要
  show_excerpt: true

  # 星空背景与天文组件（source/js/astronomy.js）
  # 关闭后不再加载该脚本，移动端 / 低端设备可关闭以省去一次请求与执行开销
  starfield: true

# ============================================================
# 搜索索引配置
# ============================================================
# 影响 public/search.json 的体积与搜索页首屏加载量。
# 索引只保存每篇文章正文的纯文本片段（已剥离 HTML 标签），
# 体积 ≈ 文章数 × index_length，与整站正文字数无关。

search:
  # 每篇文章进入索引的正文长度上限（字符数）
  # 体积估算：文章数 × index_length（英文约 1 字节/字符，中文约 3 字节/字符）
  #   500 篇、默认 1500 → 英文约 750 KB / 中文约 2.2 MB（gzip 后约为 1/3）
  # 文章多或篇幅长时可调到 600~800；搜索只在该片段内匹配，
  # 调得过小可能导致长文后半部分搜不到
  index_length: 1500

# ============================================================
# 社交链接
# ============================================================
# 留空字符串表示不显示对应图标

social:
  # GitHub
  github: ''

  # Twitter / X
  twitter: ''

  # 微博
  weibo: ''

  # 知乎
  zhihu: ''

  # 邮箱
  email: ''

# ============================================================
# 第三方服务
# ============================================================

services:
  # Giscus 评论系统（需在 GitHub 安装 giscus app）
  giscus:
    enable: false
    repo: ''
    repo_id: ''
    category: 'Announcements'
    category_id: ''
    mapping: 'pathname'
    reactions_enabled: true
    emit_metadata: false
    input_position: 'bottom'
    theme: 'light'
    lang: 'en'
    loading: 'lazy'

  # Google Analytics
  google_analytics:
    enable: false
    tracking_id: ''

  # 百度统计
  baidu_analytics:
    enable: false
    tracking_id: ''

# ============================================================
# 分页配置
# ============================================================

pagination:
  # 每页文章数
  per_page: 10

  # 分页类型: pagination | infinite
  type: 'pagination'

# ============================================================
# 文章配置
# ============================================================

article:
  # 文章摘要长度 (字符数)
  excerpt_length: 200

  # 是否显示文章更新时间
  show_updated: true

  # 是否显示阅读时间
  show_reading_time: true

# ============================================================
# 独立页面配置
# ============================================================

page:
  # 是否显示独立页面的更新时间
  show_updated: true

# ============================================================
# 图片配置
# ============================================================

image:
  # 启用图片懒加载（在最终渲染 HTML 中为文章图片添加 loading="lazy" + data-src；
  # 始终保留 src，保证即使 JS 未执行图片也能正常显示）
  lazy_load: true

  # 图片占位符颜色（懒加载图片加载前/破图时的背景色）
  placeholder_color: '#f0f0f0'

# ============================================================
# 天文组件配置
# ============================================================
# 天文事件日历（astronomy-calendar.ejs）的数据源。
# 该模板默认未被任何页面引用，属「组件库」成员——
# 在自定义页面里 <%- partial('_partial/astronomy-calendar') %> 即可启用。
#
# events 中每条事件的字段：
#   name       事件名称（必填）
#   date       事件日期 'YYYY-MM-DD'（必填，日历据此点亮 .has-event）
#   time       可选，显示用时刻，如 '14:30'
#   visibility 可选，可见条件/地区说明
astronomy:
  events: []
  # 示例（取消注释并按需修改）：
  # events:
  #   - name: '英仙座流星雨极大'
  #     date: '2026-08-12'
  #     time: '21:00'
  #     visibility: '全国可见，建议远离光污染'
  #   - name: '月全食'
  #     date: '2026-03-03'
  #     visibility: '东亚可见'

# ============================================================
# SEO 配置
# ============================================================
# 输出 canonical / robots / Open Graph / Twitter Card / JSON-LD 结构化数据。
# 站点 _config.yml 配置 url 后才会输出 canonical 与 og:url（未配置时自动省略）。

seo:
  # Open Graph 分享卡片默认图（文章无 image 封面时使用）。
  # 可填站内相对路径（如 /images/og.png）或完整 URL
  og_image: ''

  # Twitter 卡片类型：summary | summary_large_image（有分享图时生效）
  twitter_card: 'summary_large_image'

  # 归档 / 分类 / 标签页输出 robots noindex,follow（薄内容页，避免分散权重）
  noindex_archives: true

  # JSON-LD 结构化数据（post→BlogPosting，home→WebSite，page→WebPage）
  json_ld:
    enable: true

# ============================================================
# 自定义注入
# ============================================================

# 在 <head> 中注入自定义代码（如统计脚本、外链 CSS）
inject:
  head: ''

  # 在 </body> 前注入自定义代码
  body_end: ''

# ============================================================
# 高级配置
# ============================================================

# 启用调试模式
debug: false

# 自定义 CDN 前缀（资源统一前缀，例如 https://cdn.example.com）
# 启用后 main.css 与 theme.js 等静态资源都会走该前缀 + 版本号，便于 CDN 缓存刷新
cdn_prefix: ''

# URL 规范化
url:
  # 把 source/ 下手写的 foo.html 页面路由改写为 foo/index.html（目录型 URL）。
  # 文章路径由站点 permalink 决定（Hexo 默认 :year/:month/:day/:title/ 本就是目录型），
  # 不受此开关影响。
  # 建议同时把站点 _config.yml 的 pretty_urls.trailing_index / trailing_html
  # 设为 false，让 url_for 产出的链接与路由一致：
  #
  #   pretty_urls:
  #     trailing_index: false
  #     trailing_html: false
  pretty: false

# 资源版本号 (用于缓存清除)
# 升级主题后请同步修改此值，否则 CDN / 浏览器仍会命中旧的 main.css 与 JS 缓存
version: '1.1.0'

# ============================================================
# 性能优化提示
# ============================================================
# 1. CSS 压缩：在站点根目录 _config.yml 添加以下配置即可对 main.css 做压缩：
#
#   stylus:
#     compress: true
#
# 2. Google Fonts：国内网络不可用时建议将 fonts.google_fonts 设为 false，
#    或把 fonts.google_fonts_url 替换为国内镜像（如 fonts.loli.net）。
#
# 3. 图片懒加载：默认开启（image.lazy_load: true），会自动为文章图片添加
#    loading="lazy" 与 data-src，无需额外处理。
