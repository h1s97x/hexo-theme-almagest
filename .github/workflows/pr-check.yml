# PR 检查工作流
# 在每次 Pull Request 创建或更新时触发
# 执行代码规范检查，确保代码质量

name: PR Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      # 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 安装 pnpm
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # 设置 Node.js 环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'  # 缓存 pnpm 依赖，需要先安装 pnpm
          cache-dependency-path: 'pnpm-lock.yaml'  # 指定 lock 文件路径，提高缓存命中率

      # 验证 pnpm 安装
      - name: Verify pnpm
        run: pnpm --version

      # 安装依赖
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ESLint 检查 (JavaScript)
      - name: Run ESLint
        run: pnpm lint

      # Stylelint 检查 (Stylus)
      - name: Run Stylelint
        run: pnpm style:lint

      # Prettier 格式检查
      - name: Check Prettier formatting
        run: pnpm format:check

      # 构建验证（确保主题可以正常编译）
      - name: Build verification
        run: pnpm build || echo "No build script, skipping"
